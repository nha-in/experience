volumes:
  ohc_experience_local_postgres_data: {}
  ohc_experience_local_postgres_data_backups: {}
  ohc_experience_local_redis_data: {}
  ohc_experience_local_minio_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: ohc_experience_local_django
    container_name: ohc_experience_local_django
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      mailtrap-local:
        condition: service_started
      minio-create-bucket:
        condition: service_completed_successfully
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: ohc_experience_production_postgres
    container_name: ohc_experience_local_postgres
    volumes:
      - ohc_experience_local_postgres_data:/var/lib/postgresql/18/docker
      - ohc_experience_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailtrap-local:
    image: docker.io/mailtrap/mailtrap-local:latest
    container_name: ohc_experience_local_mailtrap
    ports:
      # 3550 is the web inbox; 3535 is SMTP, published so a Django process run
      # on the host (rather than in the django service) can deliver to it too.
      - "3550:3550"
      - "3535:3535"
    tmpfs:
      - /var/lib/mailtrap-local:uid=65532,gid=65532

  redis:
    image: docker.io/redis:7.2
    container_name: ohc_experience_local_redis
    volumes:
      - ohc_experience_local_redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ohc_experience_local_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ohc-local
      MINIO_ROOT_PASSWORD: ohc-local-development-key
    volumes:
      - ohc_experience_local_minio_data:/data
    ports:
      - "9200:9000"
      - "9201:9001"

  minio-create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ohc-local
      MINIO_ROOT_PASSWORD: ohc-local-development-key
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/ohc-experience-media;
      /usr/bin/mc anonymous set none local/ohc-experience-media;
      "

  celeryworker:
    <<: *django
    image: ohc_experience_local_celeryworker
    container_name: ohc_experience_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailtrap-local
    ports: []
    command: /start-celeryworker

  tailwind:
    <<: *django
    image: ohc_experience_local_tailwind
    container_name: ohc_experience_local_tailwind
    ports: []
    command: /tailwind.sh

  celerybeat:
    <<: *django
    image: ohc_experience_local_celerybeat
    container_name: ohc_experience_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailtrap-local
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: ohc_experience_local_flower
    container_name: ohc_experience_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
