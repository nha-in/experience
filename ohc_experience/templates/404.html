{% extends "base.html" %}

{% block title %}Page not found{% endblock title %}
{% block content %}
  <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Page not found</h1>
  <p class="mt-3 text-slate-600">
    {% if exception %}
      {{ exception }}
    {% else %}
      This is not the page you were looking for.
    {% endif %}
  </p>
{% endblock content %}
