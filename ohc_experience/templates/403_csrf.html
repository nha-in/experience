{% extends "base.html" %}

{% block title %}Forbidden (403){% endblock title %}
{% block content %}
  <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Forbidden (403)</h1>
  <p class="mt-3 text-slate-600">
    {% if exception %}
      {{ exception }}
    {% else %}
      You're not allowed to access this page.
    {% endif %}
  </p>
{% endblock content %}
