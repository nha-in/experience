{% if experiences %}
  <ul class="space-y-2">
    {% for experience in experiences %}
      <li class="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2 text-sm">
        <span class="font-medium text-slate-800">{{ experience.name }}</span>
        <span class="rounded-full bg-white px-2 py-0.5 text-xs font-medium text-slate-500">{{ experience.tag }}</span>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="text-sm text-slate-500">No experiences match "{{ query }}".</p>
{% endif %}
