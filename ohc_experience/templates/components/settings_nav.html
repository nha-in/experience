{% comment %}
  Team and profile share the settings layout and swap its main content via
  HTMX. Organisation uses the portal layout and needs full-page navigation.
{% endcomment %}
{% load i18n %}

<nav class="flex gap-1 overflow-x-auto pb-1 md:flex-col md:gap-0.5 md:overflow-visible md:pb-0"
     aria-label="{% translate 'Settings' %}"
     hx-boost="true"
     hx-target="#main-content"
     hx-select="#main-content"
     hx-select-oob="#app-nav"
     hx-swap="outerHTML"
     hx-push-url="true"
     hx-indicator="#nav-progress">
  <a id="settings-nav-organisation"
     class="ui-subnav-link shrink-0 {% if settings_section == 'organisation' %}ui-subnav-link--active{% endif %}"
     href="{% url 'experiences:organisation' %}" hx-boost="false"
     {% if settings_section == 'organisation' %}aria-current="page"{% endif %}>{% translate "Organisation" %}</a>
  <a id="settings-nav-team"
     class="ui-subnav-link shrink-0 {% if settings_section == 'team' %}ui-subnav-link--active{% endif %}"
     href="{% url 'organisations:team' %}"
     {% if settings_section == 'team' %}aria-current="page"{% endif %}>{% translate "Team" %}</a>
  <a id="settings-nav-profile"
     class="ui-subnav-link shrink-0 {% if settings_section == 'profile' %}ui-subnav-link--active{% endif %}"
     href="{% url 'users:profile' %}"
     {% if settings_section == 'profile' %}aria-current="page"{% endif %}>{% translate "Your profile" %}</a>
</nav>
