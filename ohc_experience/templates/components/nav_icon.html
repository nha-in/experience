<svg class="{{ icon_size|default:'size-[18px]' }} shrink-0"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.6"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true">
  {% if icon == 'overview' %}
    <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
  {% elif icon == 'credentials' %}
    <circle cx="8" cy="8" r="4.5" />
    <path d="m11.5 11.5 9 9m-3-3 2.5-2.5m-5 .5 2.5-2.5" />
  {% elif icon == 'reference' %}
    <path d="M12 2.5 21 7.5v9l-9 5-9-5v-9l9-5Z" />
    <path d="m3 7.5 9 5 9-5m-9 5v9" />
  {% elif icon == 'skills' %}
    <path d="M12 3v4m0 10v4m9-9h-4M7 12H3m14.5-6.5-2.8 2.8M9.3 15.7l-2.8 2.8m11 0-2.8-2.8M9.3 8.3 6.5 5.5" />
    <circle cx="12" cy="12" r="3" />
  {% elif icon == 'track' %}
    <path d="M12 3 3 7.5 12 12l9-4.5L12 3Zm-9 9L12 17l9-5M3 17l9 4 9-4" />
  {% elif icon == 'events' %}
    <rect x="3" y="5" width="18" height="16" rx="2" />
    <path d="M16 3v4M8 3v4M3 11h18m-13 4h3m2 0h3m-8 3h3" />
  {% elif icon == 'support' %}
    <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-1 1V11.5a9 9 0 0 1 18 0Z" />
    <path d="M8 9h8M8 13h5" />
  {% elif icon == 'queries' %}
    <path d="M9 18h6m-5 3h4M8.2 14.5a6.5 6.5 0 1 1 7.6 0L15 17H9l-.8-2.5Z" />
  {% elif icon == 'edit' %}
    <path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15l-1 6 5-2" />
  {% elif icon == 'add' %}
    <rect x="3" y="3" width="18" height="18" rx="4" />
    <path d="M12 8v8M8 12h8" />
  {% elif icon == 'organisation' %}
    <rect x="5" y="3" width="14" height="18" rx="2" />
    <path d="M9 7h1m4 0h1m-6 4h1m4 0h1m-6 4h1m4 0h1m-5 6v-3h4v3" />
  {% elif icon == 'team' %}
    <circle cx="9" cy="8" r="3" />
    <path d="M3 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v2" />
  {% elif icon == 'profile' %}
    <circle cx="12" cy="8" r="4" />
    <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
  {% elif icon == 'queue' %}
    <rect x="4" y="3" width="16" height="18" rx="2" />
    <path d="m8 8 1 1 2-2m2 1h3m-8 7 1 1 2-2m2 1h3" />
  {% elif icon == 'docs' %}
    <path d="M12 6v15m0-15C8 2 3 3 3 3v16s5-1 9 2c4-3 9-2 9-2V3s-5-1-9 3Z" />
  {% elif icon == 'info' %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 10v6m0-9h.01" />
  {% elif icon == 'logout' %}
    <path d="M9 4H4v16h5m6-13 5 5-5 5M8 12h12" />
  {% elif icon == 'chevron-left' %}
    <path d="m15 18-6-6 6-6" />
  {% elif icon == 'chevron-right' %}
    <path d="m9 18 6-6-6-6" />
  {% elif icon == 'chevrons-left' %}
    <path d="m11 17-5-5 5-5m7 10-5-5 5-5" />
  {% elif icon == 'chevrons-right' %}
    <path d="m6 17 5-5-5-5m7 10 5-5-5-5" />
  {% else %}
    <rect x="3" y="3" width="18" height="18" rx="4" />
    <path d="M8 9h8m-8 6h8" />
  {% endif %}
</svg>
