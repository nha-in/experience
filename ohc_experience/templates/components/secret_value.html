{% comment %}
  A masked secret with reveal and copy controls. `value` is the secret itself,
  `label` names it for screen readers.
{% endcomment %}
{% load i18n %}

<span class="flex min-w-0 items-center gap-0.5" data-secret>
  <span class="font-mono text-[13px] tracking-[0.12em] text-muted-foreground"
        data-secret-mask
        aria-hidden="true">••••••••••</span>
  <span class="hidden truncate font-mono text-[13px]" data-secret-value>{{ value }}</span>
  <button type="button"
          class="ui-btn ui-btn--ghost ui-btn--size-icon-xs shrink-0 text-muted-foreground no-underline hover:text-foreground"
          data-secret-toggle
          aria-pressed="false"
          title="{% blocktranslate %}Show {{ label }}{% endblocktranslate %}"
          aria-label="{% blocktranslate %}Show {{ label }}{% endblocktranslate %}">
    <svg data-icon-show
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.75"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    <svg data-icon-hide
         class="hidden"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.75"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19" />
      <path d="M6.61 6.61A18.15 18.15 0 0 0 2 12s3.5 7 10 7a9.12 9.12 0 0 0 5.39-1.61" />
      <path d="m2 2 20 20" />
    </svg>
  </button>
  {% include "components/copy_button.html" with value=value label=label %}
</span>
