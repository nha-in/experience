{% load static %}

<span class="flex min-h-11 items-center gap-3">
  {% if experience_program.authority_logo %}
    <img src="{% static experience_program.authority_logo %}"
         alt="{{ experience_program.authority_name }}"
         width="82"
         height="36"
         class="h-9 w-auto shrink-0 object-contain" />
    <span class="border-l border-border pl-3 text-lg font-semibold tracking-tight text-foreground">{{ experience_program.brand_line_2|default:experience_program.short_name }}</span>
  {% else %}
    <span class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-primary text-primary-foreground"
          aria-hidden="true">
      <svg class="size-6"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.7"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M4 8V5a1 1 0 0 1 1-1h3m8 0h3a1 1 0 0 1 1 1v3M4 16v3a1 1 0 0 0 1 1h3m8 0h3a1 1 0 0 0 1-1v-3M8 12h8m-4-4v8" />
      </svg>
    </span>
    <span class="flex min-w-0 flex-col leading-tight"><span class="text-lg font-bold tracking-tight text-foreground">{{ experience_program.short_name }}</span><span class="mt-0.5 text-xs font-medium text-soft-foreground">{{ experience_program.brand_line_2 }}</span></span>
  {% endif %}
</span>
