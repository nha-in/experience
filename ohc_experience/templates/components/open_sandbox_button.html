{% comment %}
  Opens the Care app the sandbox lives on. `url` is the environment's frontend
  URL.
{% endcomment %}
{% load i18n %}

<a class="ui-btn {{ variant|default:'ui-btn--outline' }} {{ size|default:'ui-btn--size-default' }} shrink-0 no-underline"
   href="{{ url }}"
   target="_blank"
   rel="noopener noreferrer"
   hx-boost="false">
  {% translate "Open sandbox" %}
  <svg viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="1.75"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    <path d="M7 17 17 7M9 7h8v8" />
  </svg>
</a>
