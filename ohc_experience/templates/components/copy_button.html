{% comment %}
  Icon button that copies `value`. `label` names the value for screen readers.
{% endcomment %}
{% load i18n %}

<button type="button"
        class="ui-btn ui-btn--ghost ui-btn--size-icon-xs shrink-0 text-muted-foreground no-underline hover:text-foreground"
        data-copy="{{ value }}"
        title="{% blocktranslate %}Copy {{ label }}{% endblocktranslate %}"
        aria-label="{% blocktranslate %}Copy {{ label }}{% endblocktranslate %}">
  <svg data-icon-copy
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="1.75"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    <rect x="8" y="8" width="14" height="14" rx="2" />
    <path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2" />
  </svg>
  <svg data-icon-done
       class="hidden text-green-600"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    <path d="M20 6 9 17l-5-5" />
  </svg>
</button>
