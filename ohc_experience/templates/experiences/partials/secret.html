<div id="secret-value"
     data-secret-container
     class="flex min-h-9 min-w-0 flex-wrap items-center gap-2"
     hx-history="false">
  {% if error %}
    <span class="text-sm text-red-700" role="alert">{{ error }}</span>
  {% elif secret or revealed_secret %}
    <code class="min-w-0 flex-1 break-all text-sm" data-revealed-secret>{{ secret|default:revealed_secret }}</code>
    <button class="ui-btn ui-btn--ghost ui-btn--size-sm"
            type="button"
            data-copy-value="{{ secret|default:revealed_secret }}"
            aria-label="Copy client secret">
      <span data-copy-label>Copy</span>
    </button>
    <button class="ui-btn ui-btn--outline ui-btn--size-sm"
            type="button"
            data-hide-secret>Hide</button>
  {% else %}
    <span class="flex-1 font-mono text-base tracking-widest text-soft-foreground"
          aria-label="Client secret hidden">••••••••••••</span>
    {% if credential.status == 'active' %}
      <form method="post"
            action="{% url 'experiences:credentials' workspace.reference %}"
            hx-post="{% url 'experiences:credentials' workspace.reference %}"
            hx-target="#secret-value"
            hx-select="unset"
            hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="intent" value="reveal" />
        <button class="ui-btn ui-btn--outline ui-btn--size-sm" type="submit">Reveal secret</button>
      </form>
    {% endif %}
  {% endif %}
</div>
