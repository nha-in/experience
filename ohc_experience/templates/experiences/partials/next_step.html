{# The step an integrator is recommended to take next, on the overview and on an approved milestone: `next_step` as `presentation` shapes it. #}
<section class="flex flex-col gap-4 rounded-xl border p-4 sm:flex-row sm:items-center sm:justify-between sm:px-5 {% if next_step.tone == 'warning' %}ui-alert--warning{% elif next_step.tone == 'info' %}ui-alert--info{% else %}border-primary/20 bg-accent text-accent-foreground{% endif %}"
         aria-labelledby="next-step-heading">
  <div class="flex items-start gap-3">
    <span class="mt-1 shrink-0" aria-hidden="true">{% include 'components/nav_icon.html' with icon='idea' %}</span>
    <div>
      <p class="text-[11px] font-semibold uppercase tracking-widest opacity-80">Recommended next step</p>
      <h2 class="mt-0.5 text-base font-semibold" id="next-step-heading">{{ next_step.title }}</h2>
      <p class="mt-1 text-sm leading-relaxed">{{ next_step.detail }}</p>
    </div>
  </div>
  <a class="ui-btn ui-btn--default ui-btn--size-sm shrink-0 no-underline"
     href="{{ next_step.url }}">{{ next_step.action }} <span aria-hidden="true">→</span></a>
</section>
