{% comment %}
  A phone card's "Show details", under the card's link. Context: organisation,
  after production.with_organisation_details.
{% endcomment %}
<details class="group/details px-5 pb-4">
  <summary class="inline-flex min-h-11 cursor-pointer list-none items-center gap-1 text-sm font-semibold text-primary focus-visible:outline-2 focus-visible:outline-primary [&::-webkit-details-marker]:hidden">
    <span class="group-open/details:hidden">Show details</span>
    <span class="hidden group-open/details:inline">Hide details</span>
    <svg viewBox="0 0 24 24"
         class="size-4 shrink-0 transition-transform group-open/details:rotate-180 motion-reduce:transition-none"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </summary>
  <div class="mt-1 rounded-lg bg-slate-50 px-4 py-3">
    {% include 'experiences/partials/organisation_details.html' %}
  </div>
</details>
