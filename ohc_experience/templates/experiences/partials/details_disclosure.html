{% comment %}
  A searched phone card's "Organisation details" strip, under the card's link.
  Context: organisation, after production.with_organisation_details.
{% endcomment %}
<details class="group/details border-t border-soft-border open:bg-slate-50">
  <summary class="flex min-h-11 cursor-pointer list-none items-center gap-1.5 px-5 text-sm font-semibold text-muted-foreground hover:text-foreground focus-visible:outline-2 focus-visible:outline-primary group-open/details:text-foreground [&::-webkit-details-marker]:hidden">
    Organisation details
    <svg viewBox="0 0 24 24"
         class="size-4 shrink-0 transition-transform group-open/details:rotate-180 motion-reduce:transition-none"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </summary>
  <div class="px-5 pt-1 pb-4">{% include 'experiences/partials/organisation_details.html' %}</div>
</details>
