{% comment %}
  Opens the hidden table row with organisation details under a list row
  (portal-ux.js). Context: target, the id of that row.
{% endcomment %}
<button class="group/details mt-1 flex min-h-9 items-center gap-1 text-sm font-semibold text-primary hover:underline"
        type="button"
        aria-expanded="false"
        aria-controls="{{ target }}"
        data-details-toggle>
  <span class="group-aria-expanded/details:hidden">Show details</span>
  <span class="hidden group-aria-expanded/details:inline">Hide details</span>
  <svg viewBox="0 0 24 24"
       class="size-4 shrink-0 transition-transform group-aria-expanded/details:rotate-180 motion-reduce:transition-none"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    <path d="m6 9 6 6 6-6" />
  </svg>
</button>
