{% load i18n careui %}

<form id="application-form"
      class="rounded-md border border-border bg-card p-5"
      method="post"
      action="{{ request.path }}"
      enctype="multipart/form-data"
      novalidate
      hx-post="{{ request.path }}"
      hx-encoding="multipart/form-data"
      hx-target="this"
      hx-swap="outerHTML show:window:top"
      hx-disabled-elt="find button[type=submit]"
      hx-indicator="#nav-progress">
  {% csrf_token %}
  <input type="hidden" name="submission_mode" value="{{ submission_mode }}" />
  {% include "components/form_errors.html" %}
  <div class="space-y-4">
    {% for field in form %}
      {% ui_field field %}
    {% endfor %}
  </div>
  <div class="mt-6 flex flex-wrap items-center gap-2 border-t border-border pt-4">
    <button class="ui-btn ui-btn--default ui-btn--size-default"
            type="submit"
            hx-disabled-elt="this">
      {% if submission_mode == "renew" %}
        {% translate "Submit new submission" %}
      {% elif submission_mode == "edit" and submission %}
        {% translate "Save new revision" %}
      {% else %}
        {% translate "Complete form" %}
      {% endif %}
    </button>
    <a class="ui-btn ui-btn--ghost ui-btn--size-default"
       href="{{ detail_url }}">{% translate "Cancel" %}</a>
  </div>
</form>
