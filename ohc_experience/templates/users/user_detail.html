{% extends "base.html" %}

{% load static %}

{% block title %}
  User:
  {{ object.name }}
{% endblock title %}
{% block content %}
  <section class="mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-2xl font-semibold tracking-tight text-slate-900">{{ object.name }}</h2>
    {% if object == request.user %}
      <div class="mt-6 flex flex-wrap gap-3">
        <a class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"
           href="{% url 'users:update' %}"
           role="button">My Info</a>
        <a class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"
           href="{% url 'account_email' %}"
           role="button">E-Mail</a>
        <a class="inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"
           href="{% url 'mfa_index' %}"
           role="button">MFA</a>
      </div>
    {% endif %}
  </section>
{% endblock content %}
