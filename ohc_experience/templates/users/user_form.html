{% extends "base.html" %}

{% block title %}
  {{ user.name }}
{% endblock title %}
{% block content %}
  <section class="mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">{{ user.name }}</h1>
    <form class="mt-6" method="post" action="{% url 'users:update' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit"
              class="mt-2 inline-flex items-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
        Update
      </button>
    </form>
  </section>
{% endblock content %}
