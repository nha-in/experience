name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra tag to apply to the built image (e.g. a version, optional)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Never cancel a production rollout that is already in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build:
    name: Build and push linux/arm64
    runs-on: ubuntu-24.04-arm
    environment: production
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - name: Check integration settings
        env:
          KEYCLOAK_BASE_URL: ${{ vars.KEYCLOAK_BASE_URL }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_USERNAME: ${{ vars.KEYCLOAK_USERNAME }}
          KEYCLOAK_PASSWORD: ${{ secrets.KEYCLOAK_PASSWORD }}
          KEYCLOAK_API_KEY: ${{ secrets.KEYCLOAK_API_KEY }}
          WSO2_BASE_URL: ${{ vars.WSO2_BASE_URL }}
          WSO2_CLIENT_ID: ${{ vars.WSO2_CLIENT_ID }}
          WSO2_CLIENT_SECRET: ${{ secrets.WSO2_CLIENT_SECRET }}
          WSO2_USERNAME: ${{ vars.WSO2_USERNAME }}
          WSO2_PASSWORD: ${{ secrets.WSO2_PASSWORD }}
          WSO2_KEY_MANAGER: ${{ vars.WSO2_KEY_MANAGER }}
          WSO2_SCOPES: ${{ vars.WSO2_SCOPES }}
          WSO2_SANDBOX_API_IDS: ${{ vars.WSO2_SANDBOX_API_IDS }}
          WSO2_WRAPPER_BASE_URL: ${{ vars.WSO2_WRAPPER_BASE_URL }}
          HIECM_BASE_URL: ${{ vars.HIECM_BASE_URL }}
          HIECM_CM_ID: ${{ vars.HIECM_CM_ID }}
          NOTIFICATION_APP_BASE_URL: ${{ vars.NOTIFICATION_APP_BASE_URL }}
          WASA_EXTRACTION_MODEL: ${{ vars.WASA_EXTRACTION_MODEL }}
          BEDROCK_REGION_NAME: ${{ vars.BEDROCK_REGION_NAME }}
          BEDROCK_ACCESS_KEY_ID: ${{ secrets.BEDROCK_ACCESS_KEY_ID }}
          BEDROCK_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in KEYCLOAK_BASE_URL \
            KEYCLOAK_REALM \
            KEYCLOAK_CLIENT_ID \
            KEYCLOAK_CLIENT_SECRET \
            KEYCLOAK_USERNAME \
            KEYCLOAK_PASSWORD \
            KEYCLOAK_API_KEY \
            WSO2_BASE_URL \
            WSO2_CLIENT_ID \
            WSO2_CLIENT_SECRET \
            WSO2_USERNAME \
            WSO2_PASSWORD \
            WSO2_KEY_MANAGER \
            WSO2_SCOPES \
            WSO2_SANDBOX_API_IDS \
            WSO2_WRAPPER_BASE_URL \
            HIECM_BASE_URL \
            HIECM_CM_ID \
            NOTIFICATION_APP_BASE_URL \
            WASA_EXTRACTION_MODEL \
            BEDROCK_REGION_NAME \
            BEDROCK_ACCESS_KEY_ID \
            BEDROCK_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these in the production environment:$missing"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image name
        id: prepare
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=production-latest
            type=raw,value=production-latest-${{ github.run_number }}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}
            type=raw,value=manual-{{date 'YYYYMMDD-HHmmss'}}-${{ github.actor }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: compose/production/django/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=production-django-arm64
          cache-to: type=gha,scope=production-django-arm64,mode=max

      - name: Resolve image reference
        id: ref
        env:
          IMAGE: ${{ steps.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Inspect published image
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
        run: docker buildx imagetools inspect "$IMAGE_REF"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: [api, celeryworker, celerybeat]
    env:
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_PREFIX: ${{ vars.ECS_PREFIX }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${ECS_PREFIX}-${SERVICE}" \
            --query taskDefinition > task-definition.json
          echo "Fetched ${ECS_PREFIX}-${SERVICE} revision $(jq -r .revision task-definition.json)"

      - name: Fill in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_PREFIX }}-${{ matrix.service }}
          image: ${{ env.IMAGE_REF }}
          # API_GATEWAY is the wrapper, not the DevPortal: the DevPortal is
          # unreachable from this VPC. Swap back to wso2.adapter.Wso2ApiGateway
          # once it is routed — the wrapper cannot deprovision.
          environment-variables: |
            INTEGRATION_IDP=ohc_experience.integrations.keycloak.adapter.KeycloakIdpAdmin
            INTEGRATION_API_GATEWAY=ohc_experience.integrations.wso2.wrapper.Wso2WrapperApiGateway
            INTEGRATION_BRIDGE_REGISTRY=ohc_experience.integrations.hiecm.adapter.HiecmBridgeRegistry
            KEYCLOAK_BASE_URL=${{ vars.KEYCLOAK_BASE_URL }}
            KEYCLOAK_REALM=${{ vars.KEYCLOAK_REALM }}
            KEYCLOAK_CLIENT_ID=${{ vars.KEYCLOAK_CLIENT_ID }}
            KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }}
            KEYCLOAK_USERNAME=${{ vars.KEYCLOAK_USERNAME }}
            KEYCLOAK_PASSWORD=${{ secrets.KEYCLOAK_PASSWORD }}
            KEYCLOAK_API_KEY=${{ secrets.KEYCLOAK_API_KEY }}
            WSO2_BASE_URL=${{ vars.WSO2_BASE_URL }}
            WSO2_CLIENT_ID=${{ vars.WSO2_CLIENT_ID }}
            WSO2_CLIENT_SECRET=${{ secrets.WSO2_CLIENT_SECRET }}
            WSO2_USERNAME=${{ vars.WSO2_USERNAME }}
            WSO2_PASSWORD=${{ secrets.WSO2_PASSWORD }}
            WSO2_KEY_MANAGER=${{ vars.WSO2_KEY_MANAGER }}
            WSO2_SCOPES=${{ vars.WSO2_SCOPES }}
            WSO2_SANDBOX_API_IDS=${{ vars.WSO2_SANDBOX_API_IDS }}
            WSO2_WRAPPER_BASE_URL=${{ vars.WSO2_WRAPPER_BASE_URL }}
            HIECM_BASE_URL=${{ vars.HIECM_BASE_URL }}
            HIECM_CM_ID=${{ vars.HIECM_CM_ID }}
            NOTIFICATION_APP_BASE_URL=${{ vars.NOTIFICATION_APP_BASE_URL }}
            WASA_EXTRACTION_MODEL=${{ vars.WASA_EXTRACTION_MODEL }}
            BEDROCK_REGION_NAME=${{ vars.BEDROCK_REGION_NAME }}
            BEDROCK_ACCESS_KEY_ID=${{ secrets.BEDROCK_ACCESS_KEY_ID }}
            BEDROCK_SECRET_ACCESS_KEY=${{ secrets.BEDROCK_SECRET_ACCESS_KEY }}
            SANDBOX_SIGNUP_CAPTCHA=${{ vars.SANDBOX_SIGNUP_CAPTCHA }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_PREFIX }}-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Summary
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "### Deploy — \`${SERVICE}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Cluster | \`${ECS_CLUSTER}\` |"
            echo "| Service | \`${ECS_PREFIX}-${SERVICE}\` |"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Status | ${{ job.status == 'success' && 'Deployed' || 'Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
