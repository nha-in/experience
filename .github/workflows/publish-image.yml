name: Publish sandbox image

on:
  workflow_dispatch:
  push:
    branches:
      - testing_new
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.prepare.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare image name
        id: prepare
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sandbox" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prepare.outputs.image }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: compose/production/django/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=production-django-${{ matrix.arch }}
          cache-to: type=gha,scope=production-django-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.build.outputs.image }}
          # Keep the default-branch and release aliases separate.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest-${{ github.run_number }},enable={{is_default_branch}}
            type=raw,value=production-latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          images=()
          for digest in *; do
            images+=("$IMAGE_NAME@sha256:$digest")
          done

          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Inspect published image
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          image=$(jq -r '.tags[0]' <<< "$METADATA_JSON")
          docker buildx imagetools inspect "$image"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [build, merge-manifests]
    if: github.ref == 'refs/heads/testing_new'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: sandbox
      url: https://sandbox.aws.ohc.network
    strategy:
      fail-fast: false
      matrix:
        service: [api, celeryworker, celerybeat]
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}:latest-${{ github.run_number }}
      ECS_CLUSTER: ohn-staging
      ECS_PREFIX: ohn-staging-experience
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Download current task definition
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${ECS_PREFIX}-${SERVICE}" \
            --query taskDefinition > task-definition.json
          echo "Fetched ${ECS_PREFIX}-${SERVICE} revision $(jq -r .revision task-definition.json)"

      - name: Fill in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_PREFIX }}-${{ matrix.service }}
          image: ${{ env.IMAGE_REF }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_PREFIX }}-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Summary
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "### Deploy — \`${SERVICE}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Cluster | \`${ECS_CLUSTER}\` |"
            echo "| Service | \`${ECS_PREFIX}-${SERVICE}\` |"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Status | ${{ job.status == 'success' && 'Deployed' || 'Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
