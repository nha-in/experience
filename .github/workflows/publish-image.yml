name: Publish sandbox image

on:
  workflow_dispatch:
  push:
    branches:
      - testing_new
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build:
    name: Build and publish linux/arm64
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.prepare.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image name
        id: prepare
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prepare.outputs.image }}
          # Keep the default-branch and release aliases separate.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest-${{ github.run_number }},enable={{is_default_branch}}
            type=raw,value=production-latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: compose/production/django/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=production-django-arm64
          cache-to: type=gha,scope=production-django-arm64,mode=max

      - name: Inspect published image
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          image=$(jq -r '.tags[0]' <<< "$METADATA_JSON")
          docker buildx imagetools inspect "$image"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: build
    if: github.ref == 'refs/heads/testing_new'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: sandbox
      url: https://sandbox.aws.ohc.network
    strategy:
      fail-fast: false
      matrix:
        service: [api, celeryworker, celerybeat]
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}:latest-${{ github.run_number }}
      ECS_CLUSTER: ohn-staging
      ECS_PREFIX: ohn-staging-experience
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${ECS_PREFIX}-${SERVICE}" \
            --query taskDefinition > task-definition.json
          echo "Fetched ${ECS_PREFIX}-${SERVICE} revision $(jq -r .revision task-definition.json)"

      - name: Fill in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_PREFIX }}-${{ matrix.service }}
          image: ${{ env.IMAGE_REF }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_PREFIX }}-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Summary
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "### Deploy — \`${SERVICE}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Cluster | \`${ECS_CLUSTER}\` |"
            echo "| Service | \`${ECS_PREFIX}-${SERVICE}\` |"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Status | ${{ job.status == 'success' && 'Deployed' || 'Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
