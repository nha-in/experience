name: Deploy sandbox

on:
  workflow_dispatch:
  push:
    branches:
      - testing_new
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  build:
    name: Build and push linux/arm64
    runs-on: ubuntu-24.04-arm
    environment: sandbox
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare image name
        id: prepare
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sandbox" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest-${{ github.run_number }},enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: compose/production/django/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-django-arm64
          cache-to: type=gha,scope=sandbox-django-arm64,mode=max

      - name: Resolve image reference
        id: ref
        env:
          IMAGE: ${{ steps.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Inspect published image
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
        run: docker buildx imagetools inspect "$IMAGE_REF"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: build
    if: github.ref == 'refs/heads/testing_new'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: sandbox
      url: https://sandbox.aws.ohc.network
    strategy:
      fail-fast: false
      matrix:
        service: [api, celeryworker, celerybeat]
    env:
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'ohn-staging' }}
      ECS_PREFIX: ${{ vars.ECS_PREFIX || 'ohn-staging-experience' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${ECS_PREFIX}-${SERVICE}" \
            --query taskDefinition > task-definition.json
          echo "Fetched ${ECS_PREFIX}-${SERVICE} revision $(jq -r .revision task-definition.json)"

      - name: Fill in the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_PREFIX }}-${{ matrix.service }}
          image: ${{ env.IMAGE_REF }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_PREFIX }}-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Summary
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "### Deploy — \`${SERVICE}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Cluster | \`${ECS_CLUSTER}\` |"
            echo "| Service | \`${ECS_PREFIX}-${SERVICE}\` |"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Status | ${{ job.status == 'success' && 'Deployed' || 'Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
