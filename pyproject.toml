[project]
name = "ohc-experience"
version = "0.0.1"
description = "Experience Builder"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "OHCNF", email = "ohcnf@ohc.network" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  # 5.x refuses a password over 72 bytes; Spring, and so legacy, truncated it.
  "bcrypt==4.3.0",
  "celery==5.6.3",
  "cryptography==50.0.1",
  "django==6.0.8",
  "django-allauth[mfa]==65.19.4",
  "django-anymail==15.2",
  "django-celery-beat==2.9.0",
  "django-compressor==4.6.0",
  "django-environ==0.14.0",
  "django-htmx==1.29.0",
  "django-redis==7.0.0",
  "django-storages[s3]==1.14.6",
  "django-tailwind[cookiecutter,honcho,reload]>=4.5.0",
  "flower==2.1.0",
  "gunicorn==26.2.0",
  "hiredis==3.4.1",
  "httpx==0.28.1",
  "litellm==1.101.0",
  "pillow==12.3.0",
  "psycopg[c]==3.3.6",
  "pybreaker==1.4.1",
  "pypdfium2==5.13.0",
  "redis==8.1.0",
  "sentry-sdk==2.69.2",
  "tenacity==9.1.4",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.1",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==7.1.1",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.1",
  "django-upgrade==1.32.0",
  "djlint==1.46.1",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "psycopg[c]==3.3.6",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.8",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "watchfiles==1.2.0",
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "element,slot"
# H023: &#xFE0E; keeps arrows from rendering as emoji on iOS, and the literal
# variation selector would be invisible in the templates.
ignore = "H006,H023,H030,H031"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "ohc_experience/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
